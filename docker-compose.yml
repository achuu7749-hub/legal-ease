services:
  backend:
    build: .
    env_file: .env
    ports: ["8000:8000"]
  frontend:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["8501:8501"]
    depends_on: [backend]
